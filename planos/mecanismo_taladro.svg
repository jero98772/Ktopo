<svg xmlns="http://www.w3.org/2000/svg" class="dg mech" viewBox="0 0 960 440" role="img" aria-label="Corte del taladro: el motor mueve el eje, que lleva el engranaje A y el cono delantero; los satélites en pasadores fijos invierten el giro hacia el engranaje B, que mueve el cortador trasero al revés."><style>
.dg{font-family:sans-serif;color:#1d2733;background:#eef2f6}
.blk{fill:#fff;stroke:#1d2733;stroke-width:1.4}.blk.core{fill:#e6eefc}.blk.brain{fill:#e9f6ec}
.bt{font-size:13px;font-weight:700;fill:#1d2733}.bs{font-size:11.5px;fill:#4d5a68}
.pn{font-size:11.5px;fill:#1d2733;font-family:monospace}.pin{fill:#1d2733}
.w{fill:none;stroke-width:2.2;stroke-linejoin:round}.bus{stroke-width:3.2}
.w12{stroke:#d33a2c}.wgnd{stroke:#1d2733}.w5{stroke:#e08a00}.wmot{stroke:#9a6b2f}.wsig{stroke:#2f6fd6}
.wenc{stroke:#0f9a8a}.wi2c{stroke:#3c9a3c}.wusb{stroke:#8a8f98;stroke-dasharray:6 4}
.wl{font-size:11.5px;fill:#4d5a68}.wl.strong{font-weight:700;fill:#1d2733}.dot{fill:#1d2733}
.mot{fill:#fff;stroke:#9a6b2f;stroke-width:2}.mt{font-size:14px;font-weight:700;fill:#9a6b2f}
.m-shaft{fill:#b8c0ca}.m-motor{fill:#59636f}.m-fixed{fill:#c9d1da;stroke:#1d2733}.m-a{fill:#f0b429}.m-b{fill:#4aa3ff}
.m-sp{fill:#9fb1c6;stroke:#1d2733}.m-pin{stroke:#1d2733;stroke-width:3}.m-rear{fill:#4aa3ff;opacity:.85}.m-cone{fill:#f26b3a}
.lbl{font-size:13px;font-weight:700}.lbl.a{fill:#c77700}.lbl.b{fill:#1f6fc9}
.m-rot{fill:none;stroke-width:2}.m-rot.a,.m-rotx.a{stroke:#c77700}.m-rot.b,.m-rotx.b{stroke:#1f6fc9}.m-rotc.a{fill:#c77700}.m-rotc.b{fill:#1f6fc9}.m-rotx{stroke-width:2}
.arr{stroke:currentColor}
 .dg{background:#fff}</style><rect width="100%" height="100%" fill="#ffffff"/><rect class="m-motor" x="20" y="169.0" width="110" height="80" rx="8"/><text class="bt" x="75" y="159.0" text-anchor="middle">MOTOR</text><text class="bs" x="75" y="273.0" text-anchor="middle">uno solo</text><path class="m-fixed" d="M180 87.0 h26 v108 h-14 v40 h14 v108 h-26 z"/><text class="bs" x="193" y="77.0" text-anchor="middle">collar fijo</text><rect class="m-fixed" x="206" y="97.0" width="294.0" height="14.0"/><rect class="m-fixed" x="206" y="319.0" width="294.0" height="14.0"/><text class="bs" x="330" y="91.0" text-anchor="middle">portasatélites fijo</text><polygon class="m-rear" points="526.3,191.0 535.3,191.0 535.3,81.0 236.0,47.0 229.0,55.0 526.3,89.0"/><polygon class="m-rear" points="526.3,239.0 535.3,239.0 535.3,349.0 236.0,383.0 229.0,375.0 526.3,341.0"/><text class="lbl b" x="350" y="43.0" text-anchor="middle">cortador trasero (va con B)</text><polygon class="m-a" points="413.7,139.0 419.4,136.6 435.9,164.0 435.9,215.0 435.9,266.0 419.4,293.4 413.7,291.0"/><polygon class="m-b" points="526.3,139.0 520.6,136.6 504.1,164.0 504.1,215.0 504.1,266.0 520.6,293.4 526.3,291.0"/><polygon class="m-sp" points="426.7,130.3 423.7,134.0 440.2,161.4 499.8,161.4 516.3,134.0 513.3,130.3"/><line class="m-pin" x1="470.0" y1="171.0" x2="470.0" y2="97.0"/><polygon class="m-sp" points="426.7,299.7 423.7,296.0 440.2,268.6 499.8,268.6 516.3,296.0 513.3,299.7"/><line class="m-pin" x1="470.0" y1="259.0" x2="470.0" y2="333.0"/><rect class="m-shaft" x="128" y="210.0" width="642.0" height="10" rx="3"/><path class="m-cone" d="M542.256 115.0 L770.0 215.0 L542.256 315.0 Z"/><rect class="m-shaft" x="542.256" y="210.0" width="217.74400000000003" height="10" rx="3"/><text class="lbl a" x="634.256" y="137.0" text-anchor="middle">cono delantero</text><text class="lbl a" x="392.0" y="123.0" text-anchor="middle">A</text><text class="lbl b" x="550.0" y="123.0" text-anchor="middle">B</text><text class="bs" x="470.0" 