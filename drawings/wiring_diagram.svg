 x="942" y="896">I2C</text><line class="w wusb" x1="1045" y1="892" x2="1079" y2="892"/><text class="wl" x="1087" y="896">USB / CSI</text><text class="wl" x="30" y="918">Wires that cross without a dot are not connected. Logical diagram: the physical pin order on your board is different.</text></svg>