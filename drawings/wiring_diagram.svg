<svg xmlns="http://www.w3.org/2000/svg" class="dg wiring" viewBox="0 0 1200 925" role="img" aria-label="Wiring diagram: the battery, fuse and switch feed the 12 V bus; three BTS7960 drivers run the motors; the ESP32 controls the drivers and reads the encoders, sensors and battery; the Raspberry Pi 5 talks to the ESP32 over USB."><style>
.dg{font-family:sans-serif;color:#1d2733;background:#eef2f6}
.blk{fill:#fff;stroke:#1d2733;stroke-width:1.4}.blk.core{fill:#e6eefc}.blk.brain{fill:#e9f6ec}
.bt{font-size:13px;font-weight:700;fill:#1d2733}.bs{font-size:11.5px;fill:#4d5a68}
.pn{font-size:11.5px;fill:#1d2733;font-family:monospace}.pin{fill:#1d2733}
.w{fill:none;stroke-width:2.2;stroke-linejoin:round}.bus{stroke-width:3.2}
.w12{stroke:#d33a2c}.wgnd{stroke:#1d2733}.w5{stroke:#e08a00}.wmot{stroke:#9a6b2f}.wsig{stroke:#2f6fd6}
.wenc{stroke:#0f9a8a}.wi2c{stroke:#3c9a3c}.wusb{stroke:#8a8f98;stroke-dasharray:6 4}
.wl{font-size:11.5px;fill:#4d5a68}.wl.strong{font-weight:700;fill:#1d2733}.dot{fill:#1d2733}
.mot{fill:#fff;stroke:#9a6b2f;stroke-width:2}.mt{font-size:14px;font-weight:700;fill:#9a6b2f}
.m-shaft{fill:#b8c0ca}.m-motor{fill:#59636f}.m-fixed{fill:#c9d1da;stroke:#1d2733}.m-a{fill:#f0b429}.m-b{fill:#4aa3ff}
.m-sp{fill:#9fb1c6;stroke:#1d2733}.m-pin{stroke:#1d2733;stroke-width:3}.m-rear{fill:#4aa3ff;opacity:.85}.m-cone{fill:#f26b3a}
.lbl{font-size:13px;font-weight:700}.lbl.a{fill:#c77700}.lbl.b{fill:#1f6fc9}
.m-rot{fill:none;stroke-width:2}.m-rot.a,.m-rotx.a{stroke:#c77700}.m-rot.b,.m-rotx.b{stroke:#1f6fc9}.m-rotc.a{fill:#c77700}.m-rotc.b{fill:#1f6fc9}.m-rotx{stroke-width:2}
.arr{stroke:currentColor}
 .dg{background:#fff}</style><rect width="100%" height="100%" fill="#ffffff"/><rect class="blk" x="20" y="16" width="200" height="78" rx="6"/><text class="bt" x="32" y="37">LI-ION BATTERY 3S2P</text><text class="bs" x="32" y="55">11.1 V · 12.6 V full</text><text class="bs" x="32" y="71">6 Ah · 20 A BMS</text><rect class="blk sm" x="252" y="26" width="98" height="26" rx="6"/><text class="bt" x="264" y="47">FUSE 15 A</text><rect class="blk sm" x="376" y="26" width="120" height="26" rx="6"/><text class="bt" x="388" y="47">SWITCH</text><polyline class="w w12" points="220,39 252,39"/><polyline class="w w12" points="350,39 376,39"/><polyline class="w w12" points="496,39 512,39 512,100"/><circle class="dot" cx="512" cy="100" r="3.6"/><polyline class="w wgnd" points="180,94 180,118"/><circle class="dot" cx="180" cy="118" r="3.6"/><polyline class="w w12 bus" points="30,100 1170,100"/><polyline class="w wgnd bus" points="30,118 1170,118"/><text class="wl strong" x="572" y="93">+12 V after the switch</text><text class="wl strong" x="572" y="134">common GND</text><rect class="blk" x="30" y="150" width="150" height="86" rx="6"/><text class="bt" x="42" y="171">BUCK 5.1 V · 5 A</text><text class="bs" x="42" y="189">→ Raspberry Pi 5</text><text class="bs" x="42" y="205">USB-C output</text><polyline class="w w12" points="50,100 50,150"/><circle class="dot" cx="50" cy="100" r="3.6"/><polyline class="w wgnd" points="66,118 66,150"/><circle class="dot" cx="66" cy="118" r="3.6"/><rect class="blk" x="200" y="150" width="110" height="86" rx="6"/><text class="bt" x="212" y="171">DIVIDER</text><text class="bs" x="212" y="189">100 kΩ + 27 kΩ</text><text class="bs" x="212" y="205">12.6 V → 2.7 V</text><polyline class="w w12" points="220,100 220,150"/><circle class="dot" cx="220" cy="100" r="3.6"/><polyline class="w wgnd" points="236,118 236,150"/><circle class="dot" cx="236" cy="118" r="3.6"/><rect class="blk" x="330" y="150" width="150" height="86" rx="6"/><text class="bt" x="342" y="171">BUCK 5 V · 3 A</text><text class="bs" x="342" y="189">ESP32 · LEDs</text><text class="bs" x="342" y="205">buzzer</text><polyline class="w w12" points="350,100 350,150"/><circle class="dot" cx="350" cy="100" r="3.6"/><polyline class="w wgnd" points="366,118 366,150"/><circle class="dot" cx="366" cy="118" r="3.6"/><rect class="blk" x="520" y="150" width="190" height="86" rx="6"/><text class="bt" x="532" y="171">BTS7960 · LEFT SIDE</text><text class="bs" x="532" y="189">B+ / B− to the battery</text><text class="bs" x="532" y="205">M+ / M− to 2 motors</text><polyline class="w w12" points="540,100 540,150"/><circle class="dot" cx="540" cy="100" r="3.6"/><polyline class="w wgnd" points="556,118 556,150"/><circle class="dot" cx="556" cy="118" r="3.6"/><rect class="blk" x="730" y="150" width="190" height="86" rx="6"/><text class="bt" x="742" y="171">BTS7960 · RIGHT SIDE</text><text class="bs" x="742" y="189">B+ / B− to the battery</text><text class="bs" x="742" y="205">M+ / M− to 2 motors</text><polyline class="w w12" points="750,100 750,150"/><circle class="dot" cx="750" cy="100" r="3.6"/><polyline class="w wgnd" points="766,118 766,150"/><circle class="dot" cx="766" cy="118" r="3.6"/><rect class="blk" x="940" y="150" width="190" height="86" rx="6"/><text class="bt" x="952" y="171">BTS7960 · DRILL</text><text class="bs" x="952" y="189">B+ / B− to the battery</text><text class="bs" x="952" y="205">M+ / M− to the motor</text><polyline class="w w12" points="960,100 960,150"/><circle class="dot" cx="960" cy="100" r="3.6"/><polyline class="w wgnd" points="976,118 976,150"/><circle class="dot" cx="976" cy="118" r="3.6"/><polyline class="w wmot" points="630,236 630,262 570,262 570,298"/><polyline class="w wmot" points="630,262 650,262 650,298"/><circle class="dot" cx="630" cy="262" r="3.6"/><polyline class="w wmot" points="670,236 670,274 590,274 590,298"/><polyline class="w wmot" points="670,274 670,298"/><circle class="dot" cx="670" cy="274" r="3.6"/><circle class="mot" cx="580" 