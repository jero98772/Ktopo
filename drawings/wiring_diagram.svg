 height="420" rx="6"/><text class="bt" x="312" y="441">ESP32 DevKit V1</text><text class="bs" x="312" y="459">WROOM-32 + terminal board</text><rect class="blk brain" x="30" y="430" width="200" height="112" rx="6"/><text class="bt" x="42" y="451">RASPBERRY PI 5</text><text class="bs" x="42" y="469">4–8 GB · active cooler</text><text class="bs" x="42" y="485">YOLO vision + web page</text><rect class="blk" x="30" y="600" width="200" height="52" rx="6"/><text class="bt" x="42" y="621">PI CAMERA MODULE 3</text><text class="bs" x="42" y="639">in the cab, tilted 15° down</text><rect class="blk" x="30" y="690" width="200" height="56" rx="6"/><text class="bt" x="42" y="711">WS2812B STRIP · 26 LEDs</text><text class="bs" x="42" y="729">+5 V from buck B · 1000 µF</text><rect class="blk" x="30" y="770" width="200" height="52" rx="6"/><text class="bt" x="42" y="791">ACTIVE BUZZER 5 V</text><text class="bs" x="42" y="809">with an NPN transistor</text><rect class="blk" x="640" y="660" width="200" height="52" rx="6"/><text class="bt" x="652" y="681">MPU6050 (gyro)</text><text class="bs" x="652" y="699">+3V3 · AD0 to GND (0x68)</text><rect class="blk" x="640" y="722" width="200" height="52" rx="6"/><text class="bt" x="652" y="743">VL53L0X · LEFT</text><text class="bs" x="652" y="761">+3V3 · XSHUT ← GPIO 13</text><rect class="blk" x="640" y="784" width="200" height="52" rx="6"/><text class="bt" x="652" y="805">VL53L0X · RIGHT</text><text class="bs" x="652" y="823">+3V3 · XSHUT ← GPIO 15</text><polyline class="w w5" points="105,236 105,430"/><text class="wl" x="112" y="400" text-anchor="start">5.1 V</text><polyline class="w w5" points="405,236 405,400 470,400 470,420"/><text class="wl" x="412" y="392" text-anchor="start">5 V → VIN</text><polyline class="w wsig" points="255,236 255,476 300,476"/><text class="wl" x="262" y="400" text-anchor="start">VBAT</text><polyline class="w wusb" points="230,520 300,520"/><text class="wl" x="265" y="513" text-anchor="middle">USB</text><polyline class="w wusb" points="130,542 130,600"/><text class="wl" x="137" y="576" text-anchor="start">CSI</text><polyline class="w wsig" points="300,718 230,718"/><text class="wl" x="265" y="711" text-anchor="middle">330 Ω</text><polyline class="w wsig" points="300,796 230,796"/><text class="pn" x="308" y="480">GPIO 32</text><circle class="pin" cx="300" cy="476" r="3"/><text class="pn" x="308" y="524">USB</text><circle class="pin" cx="300" cy="520" r="3"/><text class="pn" x="308" y="722">GPIO 5</text><circle class="pin" cx="300" cy="718" r="3"/><text class="pn" x="308" y="800">GPIO 14</text><circle class="pin" cx="300" cy="796" r="3"/><text class="pn" x="308" y="604">3V3 → BTS logic,</text><text class="pn" x="308" y="620">encoders, sensors</text><text class="pn" x="470" y="436" text-anchor="middle">VIN</text><polyline class="w wsig" points="550,236 550,484 510,484"/><text class="pn" x="502" y="488" text-anchor="end">25 · 26 · 27</text><circle class="pin" cx="510" cy="484" r="3"/><polyline class="w wsig" points="760,236 760,508 510,508"/><text class="pn" x="502" y="512" text-anchor="end">18 · 19 · 23</text><circle class="pin" cx="510" cy="508" r="3"/><polyline class="w wsig" points="970,236 970,532 510,532"/><text class="pn" x="502" y="536" text-anchor="end">16 · 17 · 4</text><circle class="pin" cx="510" cy="532" r="3"/><polyline class="w wenc" points="684,320 700,320 700,572 510,572"/><text class="pn" x="502" y="576" text-anchor="end">34 · 35</text><circle class="pin" cx="510" cy="572" r="3"/><polyline class="w wenc" points="894,320 910,320 910,596 510,596"/><text class="pn" x="502" y="600" text-anchor="end">36 · 39</text><circle class="pin" cx="510" cy="596" r="3"/><polyline class="w wenc" points="1059,320 1075,320 1075,620 510,620"/><text class="pn" x="502" y="624" text-anchor="end">33</text><circle class="pin" cx="510" cy="620" r="3"/><text class="wl" x="880" y="676">Drivers: RPWM · LPWM · EN</text><text class="wl" x="880" y="693">(R_EN and L_EN tied), VCC to 3V3.</text><tex