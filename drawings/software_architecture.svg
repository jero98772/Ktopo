<svg xmlns="http://www.w3.org/2000/svg" class="dg arch" viewBox="0 0 960 250" role="img" aria-label="The phone talks to the Raspberry Pi over Wi-Fi; the Raspberry Pi sends speeds to the ESP32 over USB and gets telemetry back; the ESP32 drives the motor drivers."><style>
.dg{font-family:sans-serif;color:#1d2733;background:#eef2f6}
.blk{fill:#fff;stroke:#1d2733;stroke-width:1.4}.blk.core{fill:#e6eefc}.blk.brain{fill:#e9f6ec}
.bt{font-size:13px;font-weight:700;fill:#1d2733}.bs{font-size:11.5px;fill:#4d5a68}
.pn{font-size:11.5px;fill:#1d2733;font-family:monospace}.pin{fill:#1d2733}
.w{fill:none;stroke-width:2.2;stroke-linejoin:round}.bus{stroke-width:3.2}
.w12{stroke:#d33a2c}.wgnd{stroke:#1d2733}.w5{stroke:#e08a00}.wmot{stroke:#9a6b2f}.wsig{stroke:#2f6fd6}
.wenc{stroke:#0f9a8a}.wi2c{stroke:#3c9a3c}.wusb{stroke:#8a8f98;stroke-dasharray:6 4}
.wl{font-size:11.5px;fill:#4d5a68}.wl.strong{font-weight:700;fill:#1d2733}.dot{fill:#1d2733}
.mot{fill:#fff;stroke:#9a6b2f;stroke-width:2}.mt{font-size:14px;font-weight:700;fill:#9a6b2f}
.m-shaft{fill:#b8c0ca}.m-motor{fill:#59636f}.m-fixed{fill:#c9d1da;stroke:#1d2733}.m-a{fill:#f0b429}.m-b{fill:#4aa3ff}
.m-sp{fill:#9fb1c6;stroke:#1d2733}.m-pin{stroke:#1d2733;stroke-width:3}.m-rear{fill:#4aa3ff;opacity:.85}.m-cone{fill:#f26b3a}
.lbl{font-size:13px;font-weight:700}.lbl.a{fill:#c77700}.lbl.b{fill:#1f6fc9}
.m-rot{fill:none;stroke-width:2}.m-rot.a,.m-rotx.a{stroke:#c77700}.m-rot.b,.m-rotx.b{stroke:#1f6fc9}.m-rotc.a{fill:#c77700}.m-rotc.b{fill:#1f6fc9}.m-rotx{stroke-width:2}
.arr{stroke:currentColor}
 .dg{background:#fff}</style><rect width="100%" height="100%" fill="#ffffff"/><rect class="blk " x="20" y="70" width="160" height="96" rx="8"/><text class="bt" x="100.0" y="96" text-anchor="middle">PHONE</text><text class="bs" x="100.0" y="116" text-anchor="middle">web page: video,</text><text class="bs" x="100.0" y="132" text-anchor="middle">modes and joystick</text><rect class="blk brain" x="290" y="50" width="210" height="136" rx="8"/><text class="bt" x="395.0" y="76" text-anchor="middle">RASPBERRY PI 5</text><text class="bs" x="395.0" y="96" text-anchor="middle">camera + YOLO</text><text class="bs" x="395.0" y="112" text-anchor="middle">decides what to do</text><text class="bs" x="395.0" y="128" text-anchor="middle">15 times per second</text><rect class="blk core" x="650" y="50" width="200" height="136" rx="8"/><text class="bt" x="750.0" y="76" text-anchor="middle">ESP32</text><text class="bs" x="750.0" y="96" text-anchor="middle">ramps, encoders,</text><text class="bs" x="750.0" y="112" text-anchor="middle">sensors and reflexes</text><text class="bs" x="750.0" y="128" text-anchor="middle">stops even if the Pi fails</text><rect class="blk " x="886" y="82" width="64" height="72" rx="8"/><text class="bt" x="918.0" y="108" text-anchor="middle">BTS</text><text class="bs" x="918.0" y="128" text-anchor="middle">×3</text><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs><line class="w arr" x1="180" y1="104" x2="290" y2="104" marker-end="url(#ar)"/><text class="wl" x="235.0" y="96" text-anchor="middle">Wi-Fi</text><line class="w arr" x1="290" y1="134" x2="180" y2="134" marker-end="url(#ar)"/><text class="wl" x="235.0" y="152" text-anchor="middle">video + status</text><line class="w arr" x1="500" y1="104" x2="650" y2="104" marker-end="url(#ar)"/><text class="wl" x="575.0" y="96" text-anchor="middle">V · T commands (USB)</text><line class="w arr" x1="650" y1="134" x2="500" y2="134" marker-end="url(#ar)"/><text class="wl" x="575.0" y="152" text-anchor="middle">telemetry 20 Hz</text><line class="w arr" x1="850" y1="118" x2="886" y2="118" marker-end="url(#ar)"/><text class="wl" x="868.0" y="110" text-anchor="middle">PWM</text><text class="bs" x="395" y="214" text-anchor="middle">BRAIN · Python</text><text class="bs" x="750" y="214" text-anchor="middle">SPINAL CORD · Arduino</text><text class="bs" x="750" y="232" text-anchor="middle">Phone over Bluetooth: the old letters A a i I d D S M m</text></svg>